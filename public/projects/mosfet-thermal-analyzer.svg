<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#030704; font-family:'JetBrains Mono', 'Inter', monospace, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#020803" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08140a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040a05" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid Canvas -->
  <rect width="1200" height="680" fill="url(#bgGlow)"/>
  <g stroke="#00ff88" stroke-opacity="0.04" stroke-width="1">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200 M0,400 H1200 M0,480 H1200 M0,560 H1200 M0,640 H1200" />
    <path d="M80,0 V680 M160,0 V680 M240,0 V680 M320,0 V680 M400,0 V680 M480,0 V680 M560,0 V680 M640,0 V680 M720,0 V680 M800,0 V680 M880,0 V680 M960,0 V680 M1040,0 V680 M1120,0 V680" />
  </g>

  <!-- Title & Header Bar -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.35" stroke-width="1"/>
    <text x="12" y="17" fill="#00ff88" font-size="11" font-weight="700" letter-spacing="1.5">POWER ELECTRONICS CAD</text>
    <text x="235" y="18" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">MOSFET Thermal &amp; Loss Analyzer — System Architecture</text>
    <text x="0" y="48" fill="#94a3b8" font-size="12">Mathematical Modeling, 1D Thermal Resistance Network &amp; Automated Pytest Verification Suite</text>
  </g>

  <!-- Status / Model Badge -->
  <g transform="translate(950, 45)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="21" r="5" fill="#00ff88" filter="url(#glow)"/>
    <text x="35" y="18" fill="#ffffff" font-size="11" font-weight="700">VERIFIED MODEL</text>
    <text x="35" y="32" fill="#00ff88" font-size="10">Python 3.11 • Streamlit • Plotly</text>
  </g>

  <!-- 1. INPUT LAYER -->
  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="310" height="505" rx="16" fill="url(#cardGrad)" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="42" rx="16" fill="#00ff88" fill-opacity="0.08"/>
    <text x="18" y="26" fill="#00ff88" font-size="13" font-weight="700" letter-spacing="1">1. INPUT PARAMETERS</text>
    <text x="240" y="26" fill="#64748b" font-size="10">UI / DATA</text>

    <!-- Electrical Group -->
    <g transform="translate(18, 56)">
      <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">ELECTRICAL OPERATING POINT</text>
      
      <rect x="0" y="24" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="12" y="42" fill="#94a3b8" font-size="11">RMS Current (I_RMS)</text>
      <text x="12" y="58" fill="#ffffff" font-size="12" font-weight="700">10.0 A</text>

      <rect x="0" y="74" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="12" y="92" fill="#94a3b8" font-size="11">ON-State Resistance R_DS(on)</text>
      <text x="12" y="108" fill="#ffffff" font-size="12" font-weight="700">0.020 Ω (20 mΩ)</text>

      <rect x="0" y="124" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="12" y="142" fill="#94a3b8" font-size="11">Switching Energy (E_on + E_off)</text>
      <text x="12" y="158" fill="#ffffff" font-size="12" font-weight="700">100 µJ + 100 µJ = 200 µJ</text>

      <rect x="0" y="174" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="12" y="192" fill="#94a3b8" font-size="11">Switching Frequency (f_s)</text>
      <text x="12" y="208" fill="#ffffff" font-size="12" font-weight="700">20.0 kHz (Sweep: 0 - 100 kHz)</text>
    </g>

    <!-- Thermal Group -->
    <g transform="translate(18, 290)">
      <text x="0" y="14" fill="#f59e0b" font-size="11" font-weight="700">THERMAL BOUNDARY CONDITIONS</text>

      <rect x="0" y="24" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text x="12" y="42" fill="#94a3b8" font-size="11">Ambient Temperature (T_a)</text>
      <text x="12" y="58" fill="#ffffff" font-size="12" font-weight="700">30.0 °C</text>

      <rect x="0" y="74" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text x="12" y="92" fill="#94a3b8" font-size="11">Thermal Resistance (R_θ)</text>
      <text x="12" y="108" fill="#ffffff" font-size="12" font-weight="700">8.0 °C/W (Sweep: 4, 8, 12 °C/W)</text>

      <rect x="0" y="124" width="274" height="44" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text x="12" y="142" fill="#94a3b8" font-size="11">Max Junction Temp T_j(max)</text>
      <text x="12" y="158" fill="#ffffff" font-size="12" font-weight="700">150.0 °C (Safety Threshold)</text>
    </g>
  </g>

  <!-- Connectors from Input to Calculation -->
  <path d="M360,240 L410,240" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <polygon points="415,240 405,235 405,245" fill="#00ff88"/>

  <path d="M360,450 L410,450" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <polygon points="415,450 405,445 405,455" fill="#00ff88"/>

  <!-- 2. CORE CALCULATION ENGINE (losses.py) -->
  <g transform="translate(420, 125)">
    <rect x="0" y="0" width="370" height="505" rx="16" fill="url(#cardGrad)" stroke="#00ff88" stroke-opacity="0.35" stroke-width="1.4"/>
    <rect x="0" y="0" width="370" height="42" rx="16" fill="#00ff88" fill-opacity="0.1"/>
    <text x="18" y="26" fill="#00ff88" font-size="13" font-weight="700" letter-spacing="1">2. CALCULATION ENGINE (losses.py)</text>
    <text x="290" y="26" fill="#00ff88" font-size="10" font-mono>CORE</text>

    <!-- Loss Formulas Box -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="334" height="110" rx="10" fill="#030804" stroke="#00ff88" stroke-opacity="0.25"/>
      <text x="14" y="22" fill="#00ff88" font-size="11" font-weight="700">CONDUCTION LOSS MODEL</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="12" font-family="'JetBrains Mono', monospace">P_cond = I_RMS² × R_DS(on)</text>
      <text x="14" y="66" fill="#94a3b8" font-size="11">P_cond = (10 A)² × 0.020 Ω</text>
      <rect x="14" y="76" width="130" height="22" rx="6" fill="#00ff88" fill-opacity="0.15"/>
      <text x="24" y="91" fill="#00ff88" font-size="11" font-weight="700">RESULT = 2.00 W</text>
    </g>

    <g transform="translate(18, 178)">
      <rect x="0" y="0" width="334" height="110" rx="10" fill="#030804" stroke="#00ff88" stroke-opacity="0.25"/>
      <text x="14" y="22" fill="#00ff88" font-size="11" font-weight="700">SWITCHING LOSS MODEL</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="12" font-family="'JetBrains Mono', monospace">P_sw = (E_on + E_off) × f_s</text>
      <text x="14" y="66" fill="#94a3b8" font-size="11">P_sw = 200 µJ × 20,000 Hz</text>
      <rect x="14" y="76" width="130" height="22" rx="6" fill="#00ff88" fill-opacity="0.15"/>
      <text x="24" y="91" fill="#00ff88" font-size="11" font-weight="700">RESULT = 4.00 W</text>
    </g>

    <g transform="translate(18, 300)">
      <rect x="0" y="0" width="334" height="185" rx="10" fill="#030804" stroke="#00ff88" stroke-opacity="0.25"/>
      <text x="14" y="22" fill="#f59e0b" font-size="11" font-weight="700">1D THERMAL RESISTANCE MODEL</text>
      
      <text x="14" y="44" fill="#e2e8f0" font-size="12" font-family="'JetBrains Mono', monospace">P_total = P_cond + P_sw = 6.00 W</text>
      
      <text x="14" y="68" fill="#e2e8f0" font-size="12" font-family="'JetBrains Mono', monospace">T_j = T_a + (P_total × R_θ)</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11">T_j = 30°C + (6.0 W × 8.0 °C/W)</text>
      <rect x="14" y="98" width="145" height="22" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="24" y="113" fill="#f59e0b" font-size="11" font-weight="700">T_j = 78.00 °C</text>

      <text x="14" y="138" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">Margin = T_j(max) - T_j</text>
      <text x="14" y="156" fill="#94a3b8" font-size="11">Margin = 150°C - 78°C = +72.00 °C</text>
      <rect x="14" y="162" width="220" height="18" rx="4" fill="#00ff88" fill-opacity="0.1"/>
      <text x="20" y="175" fill="#00ff88" font-size="10" font-weight="700">SAFE OPERATING REGION (SOA)</text>
    </g>
  </g>

  <!-- Connectors from Calculation to Outputs -->
  <path d="M790,240 L840,240" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <polygon points="845,240 835,235 835,245" fill="#00ff88"/>

  <path d="M790,450 L840,450" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <polygon points="845,450 835,445 835,455" fill="#00ff88"/>

  <!-- 3. DASHBOARD & VALIDATION LAYER (app.py & test_losses.py) -->
  <g transform="translate(850, 125)">
    <rect x="0" y="0" width="300" height="505" rx="16" fill="url(#cardGrad)" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1.2"/>
    <rect x="0" y="0" width="300" height="42" rx="16" fill="#00ff88" fill-opacity="0.08"/>
    <text x="18" y="26" fill="#00ff88" font-size="13" font-weight="700" letter-spacing="1">3. DASHBOARD &amp; OUTPUTS</text>
    <text x="235" y="26" fill="#64748b" font-size="10">UI / VIS</text>

    <!-- KPI Display Metrics -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="264" height="120" rx="10" fill="#00ff88" fill-opacity="0.04" stroke="#00ff88" stroke-opacity="0.2"/>
      <text x="12" y="20" fill="#00ff88" font-size="11" font-weight="700">DASHBOARD KPI METRICS</text>

      <g transform="translate(12, 32)">
        <text x="0" y="14" fill="#94a3b8" font-size="10">Total MOSFET Loss:</text>
        <text x="160" y="14" fill="#ffffff" font-size="12" font-weight="700">6.00 W</text>

        <text x="0" y="34" fill="#94a3b8" font-size="10">Est. Junction Temp:</text>
        <text x="160" y="34" fill="#f59e0b" font-size="12" font-weight="700">78.0 °C</text>

        <text x="0" y="54" fill="#94a3b8" font-size="10">Thermal Margin:</text>
        <text x="160" y="54" fill="#00ff88" font-size="12" font-weight="700">+72.0 °C</text>

        <text x="0" y="74" fill="#94a3b8" font-size="10">MOSFET Efficiency:</text>
        <text x="160" y="74" fill="#38bdf8" font-size="12" font-weight="700">~94.34 %</text>
      </g>
    </g>

    <!-- Parametric Sweep Graphs Preview -->
    <g transform="translate(18, 190)">
      <rect x="0" y="0" width="264" height="135" rx="10" fill="#000000" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.25"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">PLOTLY PARAMETRIC SWEEPS</text>
      
      <!-- Mini Chart 1: Loss vs Freq -->
      <g transform="translate(12, 30)">
        <path d="M10,45 L70,30 L130,15 L190,5" fill="none" stroke="#00ff88" stroke-width="2"/>
        <path d="M10,45 L190,45" stroke="#475569" stroke-width="1"/>
        <circle cx="10" cy="45" r="3" fill="#00ff88"/>
        <circle cx="70" cy="30" r="3" fill="#00ff88"/>
        <circle cx="130" cy="15" r="3" fill="#00ff88"/>
        <circle cx="190" cy="5" r="3" fill="#00ff88"/>
        <text x="10" y="60" fill="#64748b" font-size="9">f_s (kHz) vs P_loss (Linear scaling)</text>
      </g>

      <!-- Thermal Comparison -->
      <g transform="translate(12, 100)">
        <text x="0" y="10" fill="#94a3b8" font-size="9">Heatsink R_θ: 4°C/W (54°C) | 8°C/W (78°C) | 12°C/W (102°C)</text>
        <text x="0" y="24" fill="#64748b" font-size="9">• CSV Export • Real-time Overtemp Warning</text>
      </g>
    </g>

    <!-- Pytest Unit Verification -->
    <g transform="translate(18, 340)">
      <rect x="0" y="0" width="264" height="145" rx="10" fill="#030804" stroke="#00ff88" stroke-opacity="0.3"/>
      <text x="12" y="20" fill="#00ff88" font-size="11" font-weight="700">PYTEST AUTOMATION (5 TESTS)</text>
      
      <g transform="translate(12, 30)">
        <text x="0" y="15" fill="#00ff88" font-size="10">✓ Test 1: Conduction Loss (2.0 W)</text>
        <text x="0" y="32" fill="#00ff88" font-size="10">✓ Test 2: Switching Loss (4.0 W)</text>
        <text x="0" y="49" fill="#00ff88" font-size="10">✓ Test 3: Total Loss &amp; Tj (6W / 78°C)</text>
        <text x="0" y="66" fill="#00ff88" font-size="10">✓ Test 4: 2x Freq Doubling Linearity</text>
        <text x="0" y="83" fill="#00ff88" font-size="10">✓ Test 5: Negative Current ValueError</text>
      </g>
      <rect x="12" y="118" width="240" height="18" rx="4" fill="#00ff88" fill-opacity="0.15"/>
      <text x="45" y="131" fill="#00ff88" font-size="10" font-weight="700">100% PASSING TEST SUITE</text>
    </g>
  </g>
</svg>
